<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorite Singers</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">My Favorite Singers</h1>
    <p class="text-center text-secondary mb-5">Some artists and songs I enjoy listening to</p>

    <div class="row align-items-center g-4">
      <!-- First Bootstrap column: image -->
      <div class="col-sm-4 text-center">
        <img src="images/singer.svg" class="img-fluid singer-image" alt="Illustration of a singer holding a microphone">
      </div>

      <!-- Second Bootstrap column: table -->
      <div class="col-sm-8">
        <div class="table-responsive">
          <table class="table table-striped table-bordered table-hover">
            <thead class="table-dark">
              <tr>
                <th scope="col">Singer</th>
                <th scope="col">Hometown</th>
                <th scope="col">Best Songs</th>
              </tr>
            </thead>
            <tbody id="singerTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
